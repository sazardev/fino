name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: tool/check_generated.sh
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: File length
        run: dart run tool/check_file_length.dart
      - name: Tests with coverage
        run: flutter test --coverage
      - name: Coverage thresholds
        run: dart run tool/check_coverage.dart

  build-web:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [dev, qa]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web -t lib/main_${{ matrix.flavor }}.dart

  build-android:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [dev, qa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter build apk --debug
          --flavor ${{ matrix.flavor }}
          -t lib/main_${{ matrix.flavor }}.dart

  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quality gates are still in place
        run: |
          test -s lefthook.yml
          grep -q 'flutter analyze --fatal-infos --fatal-warnings' lefthook.yml
          grep -q 'check_file_length' lefthook.yml
          test -x tool/check.sh
